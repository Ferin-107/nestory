<!DOCTYPE html><html lang="en"><head><title>Login – Nestory</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body><header><div class="wrap"><nav><a class="logo" href="index.html">Nestory</a><ul><li><a href="index.html#gallery">Inspiration</a></li><li><a href="index.html#journal">Journal</a></li><li><a href="saved.html">My Board</a></li><li id="authLink"><a class="btn" href="login.html">Login</a></li></ul></nav></div></header><div id="toast"></div>
<main class="auth"><h2>Your inspiration board</h2><p style="color:var(--mut)">Log in or sign up to save designs.</p>
<div class="tabs"><button class="chip on">Login</button><button class="chip">Sign up</button></div>
<form id="loginForm" novalidate><label>Email<input type="email" autocomplete="email"><span class="err"></span></label><label>Password<input type="password"><span class="err"></span></label><button class="btn">Log in</button></form>
<form id="signupForm" class="hide" novalidate><label>Full name<input type="text"><span class="err"></span></label><label>Email<input type="email"><span class="err"></span></label><label>Password<input type="password"><span class="err"></span></label><label>Confirm password<input type="password"><span class="err"></span></label><button class="btn">Create account</button></form></main>
<script src="js/script.js"></script></body></html>
